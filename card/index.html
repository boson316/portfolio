  <script>
    (function () {
      'use strict';

      var I18N = {
        zh: {
          doc_title: '黃柏森 · 數位名片',
          name: '黃柏森',
          name_sub: 'Boson Huang',
          tagline: '資工 · 前端 · AI · GPU/CUDA',
          bio: '國立宜蘭大學 資訊工程學系 學士就讀中。',
          link_portfolio: '作品集',
          link_github: 'GitHub Profile',
          link_fintools: 'FinTools · 年化／退休計算機',
          link_email: 'Email',
          email_copy: '複製',
          email_copied: '已複製',
          foot: '分享短網址：boson316.github.io/portfolio/card/',
          theme_aria: '切換暗黑模式',
          social_nav: '社群連結',
          social_facebook: 'Facebook',
          social_instagram: 'Instagram',
          social_linkedin: 'LinkedIn',
          social_yt_life: 'YouTube · 生活',
          social_yt_life_tag: '生活',
          social_yt_finance: 'YouTube · 財金',
          social_yt_finance_tag: '財金',
          social_blog: '方格子部落格'
        },
        en: {
          doc_title: 'Boson Huang · Digital Card',
          name: 'Boson Huang',
          name_sub: '黃柏森',
          tagline: 'CS · Frontend · AI · GPU/CUDA',
          bio: 'B.S. student in Computer Science and Information Engineering at National Ilan University. Focused on frontend, AI applications, and GPU/CUDA — building demos that are showable and reproducible.',
          link_portfolio: 'Portfolio',
          link_github: 'GitHub Profile',
          link_fintools: 'FinTools · Annual Return / Retirement',
          link_email: 'Email',
          email_copy: 'Copy',
          email_copied: 'Copied',
          foot: 'Share: boson316.github.io/portfolio/card/',
          theme_aria: 'Toggle dark mode',
          social_nav: 'Social links',
          social_facebook: 'Facebook',
          social_instagram: 'Instagram',
          social_linkedin: 'LinkedIn',
          social_yt_life: 'YouTube · Life',
          social_yt_life_tag: 'Life',
          social_yt_finance: 'YouTube · Finance',
          social_yt_finance_tag: 'Finance',
          social_blog: 'Vocus Blog'
        }
      };

      var currentLang = document.documentElement.getAttribute('data-lang') || 'zh';

      function t(key) {
        return (I18N[currentLang] && I18N[currentLang][key]) || I18N.zh[key] || key;
      }

      function setLanguage(lang) {
        if (!I18N[lang]) lang = 'zh';
        currentLang = lang;
        localStorage.setItem('portfolio-lang', lang);
        document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-TW' : 'en');
        document.documentElement.setAttribute('data-lang', lang);
        document.title = t('doc_title');

        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          el.textContent = t(el.getAttribute('data-i18n'));
        });
        document.querySelectorAll('[data-i18n-alt]').forEach(function (el) {
          el.setAttribute('alt', t(el.getAttribute('data-i18n-alt')));
        });
        document.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
          el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
        });

        var socialNav = document.querySelector('.card-social');
        if (socialNav) socialNav.setAttribute('aria-label', t('social_nav'));

        document.querySelectorAll('.lang-btn').forEach(function (btn) {
          var active = btn.getAttribute('data-set-lang') === lang;
          btn.classList.toggle('is-active', active);
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });

        var themeBtn = document.getElementById('themeToggle');
        if (themeBtn) themeBtn.setAttribute('aria-label', t('theme_aria'));
      }

      document.querySelectorAll('[data-set-lang]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setLanguage(btn.getAttribute('data-set-lang'));
        });
      });

      var themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', function () {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('portfolio-theme', next);
        });
      }

      var EMAIL = 'poboson316@gmail.com';
      var emailBtn = document.getElementById('emailBtn');
      var emailPopover = document.getElementById('emailPopover');
      var emailCopy = document.getElementById('emailCopy');

      function closeEmailPopover() {
        if (!emailPopover || !emailBtn) return;
        emailPopover.hidden = true;
        emailBtn.setAttribute('aria-expanded', 'false');
      }

      function openEmailPopover() {
        if (!emailPopover || !emailBtn) return;
        emailPopover.hidden = false;
        emailBtn.setAttribute('aria-expanded', 'true');
        if (emailCopy) emailCopy.textContent = t('email_copy');
      }

      if (emailBtn && emailPopover) {
        emailBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (emailPopover.hidden) openEmailPopover();
          else closeEmailPopover();
        });
        emailPopover.addEventListener('click', function (e) {
          e.stopPropagation();
        });
        document.addEventListener('click', closeEmailPopover);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeEmailPopover();
        });
      }

      if (emailCopy) {
        emailCopy.addEventListener('click', function () {
          function done() {
            emailCopy.textContent = t('email_copied');
            setTimeout(function () {
              emailCopy.textContent = t('email_copy');
            }, 1500);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(EMAIL).then(done).catch(function () {
              window.prompt(t('email_copy'), EMAIL);
            });
          } else {
            window.prompt(t('email_copy'), EMAIL);
          }
        });
      }

      setLanguage(currentLang);
    })();
  </script>
