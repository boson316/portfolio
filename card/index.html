<!DOCTYPE html>
<html lang="zh-TW" data-lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黃柏森 · 數位名片</title>
  <meta name="description" content="黃柏森（Boson Huang）數位名片：國立宜蘭大學資工系、作品集、GitHub、FinTools。">
  <meta name="theme-color" content="#c45c26" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="card.css">
  <script>
    (function () {
      var theme = localStorage.getItem('portfolio-theme');
      var dark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

      var lang = localStorage.getItem('portfolio-lang');
      if (!lang) lang = (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
      document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-TW' : 'en');
      document.documentElement.setAttribute('data-lang', lang);
    })();
  </script>
</head>
<body>
  <div class="card-top">
    <button type="button" class="lang-btn" id="btn-zh" data-set-lang="zh" aria-pressed="true">中文</button>
    <button type="button" class="lang-btn" id="btn-en" data-set-lang="en" aria-pressed="false">EN</button>
    <button type="button" class="theme-btn" id="themeToggle" aria-label="切換暗黑模式">☀ / 🌙</button>
  </div>

  <main class="card-shell">
    <header class="card-brand">
      <h1 class="card-name" data-i18n="name">黃柏森</h1>
      <p class="card-name-en" data-i18n="name_sub">Boson Huang</p>
      <p class="tagline" data-i18n="tagline">資工 · 前端 · AI · GPU/CUDA</p>
      <p class="card-bio" data-i18n="bio">國立宜蘭大學 資訊工程學系 學士就讀中。</p>
    </header>

    <ul class="card-links">
      <li>
        <a class="card-link card-link--primary" href="https://boson316.github.io/portfolio/" data-i18n="link_portfolio">作品集</a>
      </li>
      <li>
        <a class="card-link" href="https://github.com/boson316" target="_blank" rel="noopener" data-i18n="link_github">GitHub Profile</a>
      </li>
      <li>
        <a class="card-link" href="https://boson316.github.io/niu/annual_return_calculator_v5.html" target="_blank" rel="noopener" data-i18n="link_fintools">FinTools · 年化／退休計算機</a>
      </li>
      <li class="card-email-wrap">
        <button type="button" class="card-link" id="emailBtn" data-i18n="link_email" aria-expanded="false" aria-controls="emailPopover">Email</button>
        <div class="email-popover" id="emailPopover" hidden role="dialog" aria-label="Email">
          <p class="email-popover-addr">poboson316@gmail.com</p>
          <div class="email-popover-actions">
            <button type="button" class="email-popover-btn" id="emailCopy" data-i18n="email_copy">複製</button>
          </div>
        </div>
      </li>
    </ul>

    <p class="card-foot" data-i18n="foot">分享短網址：boson316.github.io/portfolio/card/</p>
  </main>

  <script>
    (function () {
      'use strict';

      var I18N = {
        zh: {
          doc_title: '黃柏森 · 數位名片',
          name: '黃柏森',
          name_sub: 'Boson Huang',
          tagline: '資工 · 前端 · AI · GPU/CUDA',
          bio: '國立宜蘭大學 資訊工程學系 學士就讀中。專注前端、AI 應用與 GPU/CUDA 實作，持續把專案做成可展示、可重現的作品。',
          link_portfolio: '作品集',
          link_github: 'GitHub Profile',
          link_fintools: 'FinTools · 年化／退休計算機',
          link_email: 'Email',
          email_copy: '複製',
          email_copied: '已複製',
          foot: '分享短網址：boson316.github.io/portfolio/card/',
          theme_aria: '切換暗黑模式'
        },
        en: {
          doc_title: 'Boson Huang · Digital Card',
          name: 'Boson Huang',
          name_sub: '黃柏森',
          tagline: 'CS · Frontend · AI · GPU/CUDA',
          bio: 'B.S. student in Computer Science and Information Engineering at National Ilan University. Focused on frontend, AI applications, and GPU/CUDA — building demos that are showable and reproducible.',
          link_portfolio: 'Portfolio',
          link_github: 'GitHub Profile',
          link_fintools: 'FinTools · Annual Return / Retirement',
          link_email: 'Email',
          email_copy: 'Copy',
          email_copied: 'Copied',
          foot: 'Share: boson316.github.io/portfolio/card/',
          theme_aria: 'Toggle dark mode'
        }
      };

      var currentLang = document.documentElement.getAttribute('data-lang') || 'zh';

      function t(key) {
        return (I18N[currentLang] && I18N[currentLang][key]) || I18N.zh[key] || key;
      }

      function setLanguage(lang) {
        if (!I18N[lang]) lang = 'zh';
        currentLang = lang;
        localStorage.setItem('portfolio-lang', lang);
        document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-TW' : 'en');
        document.documentElement.setAttribute('data-lang', lang);
        document.title = t('doc_title');

        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          el.textContent = t(el.getAttribute('data-i18n'));
        });
        document.querySelectorAll('[data-i18n-alt]').forEach(function (el) {
          el.setAttribute('alt', t(el.getAttribute('data-i18n-alt')));
        });

        document.querySelectorAll('.lang-btn').forEach(function (btn) {
          var active = btn.getAttribute('data-set-lang') === lang;
          btn.classList.toggle('is-active', active);
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });

        var themeBtn = document.getElementById('themeToggle');
        if (themeBtn) themeBtn.setAttribute('aria-label', t('theme_aria'));
      }

      document.querySelectorAll('[data-set-lang]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setLanguage(btn.getAttribute('data-set-lang'));
        });
      });

      var themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', function () {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('portfolio-theme', next);
        });
      }

      var EMAIL = 'poboson316@gmail.com';
      var emailBtn = document.getElementById('emailBtn');
      var emailPopover = document.getElementById('emailPopover');
      var emailCopy = document.getElementById('emailCopy');

      function closeEmailPopover() {
        if (!emailPopover || !emailBtn) return;
        emailPopover.hidden = true;
        emailBtn.setAttribute('aria-expanded', 'false');
      }

      function openEmailPopover() {
        if (!emailPopover || !emailBtn) return;
        emailPopover.hidden = false;
        emailBtn.setAttribute('aria-expanded', 'true');
        if (emailCopy) emailCopy.textContent = t('email_copy');
      }

      if (emailBtn && emailPopover) {
        emailBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (emailPopover.hidden) openEmailPopover();
          else closeEmailPopover();
        });
        emailPopover.addEventListener('click', function (e) {
          e.stopPropagation();
        });
        document.addEventListener('click', closeEmailPopover);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeEmailPopover();
        });
      }

      if (emailCopy) {
        emailCopy.addEventListener('click', function () {
          function done() {
            emailCopy.textContent = t('email_copied');
            setTimeout(function () {
              emailCopy.textContent = t('email_copy');
            }, 1500);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(EMAIL).then(done).catch(function () {
              window.prompt(t('email_copy'), EMAIL);
            });
          } else {
            window.prompt(t('email_copy'), EMAIL);
          }
        });
      }

      setLanguage(currentLang);
    })();
  </script>
</body>
</html>
